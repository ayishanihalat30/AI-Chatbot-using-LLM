services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10 }
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    profiles: ["local-llm"]   # docker compose --profile local-llm up
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MODEL_CACHE_DIR: /data/models
    volumes: ["uploads:/data/uploads", "models:/data/models"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MODEL_CACHE_DIR: /data/models
    volumes: ["uploads:/data/uploads", "models:/data/models"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
volumes:
  uploads:
  models:
  ollama:
